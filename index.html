<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile optimization -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>City Metro Map</title>

  <!-- Local Leaflet files -->
  <link rel="stylesheet" href="leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       TOP NAVIGATION BAR
       ========================= */

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 64px;

      background: #ffffff;
      border-bottom: 1px solid #dddddd;

      display: flex;
      align-items: center;

      padding: 0 24px;

      z-index: 2000;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    #brand {
      font-size: 22px;
      font-weight: 700;
      color: #222222;

      text-decoration: none;

      white-space: nowrap;
    }

    #navLinks {
      display: flex;
      align-items: center;
      margin-left: auto;
      gap: 8px;
    }

    #navLinks a {
      text-decoration: none;

      color: #333333;

      padding: 10px 16px;

      border-radius: 8px;

      font-size: 15px;
      font-weight: 600;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    #navLinks a:hover {
      background: #eeeeee;
      color: #000000;
    }

    /* =========================
       MOBILE HAMBURGER
       ========================= */

    #menuButton {
      display: none;

      margin-left: auto;

      width: 44px;
      height: 44px;

      border: none;
      border-radius: 8px;

      background: #f2f2f2;

      cursor: pointer;

      font-size: 25px;
      line-height: 44px;
      text-align: center;
    }

    #menuButton:hover {
      background: #e5e5e5;
    }

    /* =========================
       MOBILE MENU
       ========================= */

    #mobileMenu {
      display: none;

      position: fixed;

      top: 64px;
      left: 0;
      right: 0;

      background: white;

      border-bottom: 1px solid #dddddd;

      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);

      z-index: 1999;
    }

    #mobileMenu a {
      display: block;

      padding: 17px 22px;

      color: #222222;

      text-decoration: none;

      font-size: 17px;
      font-weight: 600;

      border-bottom: 1px solid #eeeeee;
    }

    #mobileMenu a:active {
      background: #eeeeee;
    }

    /* =========================
       MAP
       ========================= */

    #map {
      position: fixed;

      top: 64px;
      left: 0;

      width: 100vw;

      height: calc(100vh - 64px);

      background: white;

      z-index: 1;
    }

    .leaflet-container {
      background: white !important;

      font-family: Arial, Helvetica, sans-serif;

      touch-action: none;
    }

    /* Make zoom buttons easier to tap */
    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;

      line-height: 40px !important;

      font-size: 22px !important;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      #navbar {
        height: 58px;

        padding: 0 14px;
      }

      #brand {
        font-size: 19px;
      }

      #navLinks {
        display: none;
      }

      #menuButton {
        display: block;
      }

      #mobileMenu {
        top: 58px;
      }

      #map {
        top: 58px;

        height: calc(100vh - 58px);
      }

      .leaflet-control-zoom {
        margin-top: 10px !important;
        margin-right: 10px !important;
      }

      .leaflet-control-zoom a {
        width: 44px !important;
        height: 44px !important;

        line-height: 44px !important;

        font-size: 24px !important;
      }
    }

    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 380px) {

      #brand {
        font-size: 17px;
      }

      #menuButton {
        width: 42px;
        height: 42px;
        line-height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
       ========================= -->

  <nav id="navbar">

    <a
      id="brand"
      href="https://citymetro.xyz"
    >
      City Metro
    </a>

    <!-- Desktop navigation -->
    <div id="navLinks">

      <a href="https://citymetro.xyz">
        Home
      </a>

      <a href="https://alerts.citymetro.xyz">
        Alerts
      </a>

      <a href="https://trip-planner.citymetro.xyz">
        Trip Planner
      </a>

    </div>

    <!-- Mobile hamburger -->
    <button
      id="menuButton"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>

  </nav>


  <!-- =========================
       MOBILE MENU
       ========================= -->

  <div id="mobileMenu">

    <a href="https://citymetro.xyz">
      🏠 Home
    </a>

    <a href="https://alerts.citymetro.xyz">
      ⚠️ Alerts
    </a>

    <a href="https://trip-planner.citymetro.xyz">
      🧭 Trip Planner
    </a>

  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- Local Leaflet -->
  <script src="leaflet.js"></script>

  <script>

    /*
     * ============================================
     * CITY METRO INTERACTIVE MAP
     * ============================================
     *
     * Image:
     * Lego City County Metro August 2026.png
     *
     * Actual image dimensions:
     * 2048 × 1331
     *
     * The dimensions are detected automatically,
     * so you don't have to change them later.
     */


    // --------------------------------------------
    // Create map after image loads
    // --------------------------------------------

    const image = new Image();

    image.src = "Lego City County Metro August 2026.png";


    image.onload = function () {

      const imageWidth = image.naturalWidth;
      const imageHeight = image.naturalHeight;

      console.log(
        "Metro map image:",
        imageWidth,
        "×",
        imageHeight
      );


      // Image coordinates
      const bounds = [
        [0, 0],
        [imageHeight, imageWidth]
      ];


      // ------------------------------------------
      // Create Leaflet map
      // ------------------------------------------

      const map = L.map("map", {

        crs: L.CRS.Simple,

        minZoom: -5,

        maxZoom: 5,

        zoomSnap: 0.1,

        zoomDelta: 0.5,

        zoomControl: true,

        scrollWheelZoom: true,

        doubleClickZoom: true,

        dragging: true,

        touchZoom: true,

        inertia: true,

        maxBounds: bounds,

        maxBoundsViscosity: 1.0

      });


      // ------------------------------------------
      // Add Metro Map image
      // ------------------------------------------

      L.imageOverlay(
        "Lego City County Metro August 2026.png",
        bounds
      ).addTo(map);


      // ------------------------------------------
      // Automatically fit map to screen
      // ------------------------------------------

      function fitMap() {

        map.invalidateSize({
          animate: false
        });

        map.fitBounds(
          bounds,
          {
            padding: [10, 10],
            animate: false
          }
        );

      }


      // Initial fit
      fitMap();


      // ------------------------------------------
      // Handle desktop resizing
      // ------------------------------------------

      window.addEventListener(
        "resize",
        function () {

          setTimeout(
            fitMap,
            100
          );

        }
      );


      // ------------------------------------------
      // Handle mobile rotation
      // ------------------------------------------

      window.addEventListener(
        "orientationchange",
        function () {

          setTimeout(
            fitMap,
            300
          );

        }
      );


      // ------------------------------------------
      // Handle fullscreen / viewport changes
      // ------------------------------------------

      document.addEventListener(
        "fullscreenchange",
        function () {

          setTimeout(
            fitMap,
            300
          );

        }
      );

    };


    // --------------------------------------------
    // Image loading error
    // --------------------------------------------

    image.onerror = function () {

      console.error(
        "Could not load MetroMap image."
      );

      alert(
        "Could not load MetroMap image. Make sure the file is named exactly:\n\nLego City County Metro August 2026.png"
      );

    };


    // ============================================
    // MOBILE MENU
    // ============================================

    const menuButton =
      document.getElementById("menuButton");

    const mobileMenu =
      document.getElementById("mobileMenu");


    let menuOpen = false;


    menuButton.addEventListener(
      "click",
      function () {

        menuOpen = !menuOpen;


        if (menuOpen) {

          mobileMenu.style.display = "block";

          menuButton.textContent = "✕";

          menuButton.setAttribute(
            "aria-expanded",
            "true"
          );

        } else {

          mobileMenu.style.display = "none";

          menuButton.textContent = "☰";

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );


    // --------------------------------------------
    // Close menu when a link is clicked
    // --------------------------------------------

    const mobileLinks =
      mobileMenu.querySelectorAll("a");


    mobileLinks.forEach(
      function (link) {

        link.addEventListener(
          "click",
          function () {

            mobileMenu.style.display = "none";

            menuButton.textContent = "☰";

            menuOpen = false;

            menuButton.setAttribute(
              "aria-expanded",
              "false"
            );

          }
        );

      }
    );

  </script>

</body>
</html>
