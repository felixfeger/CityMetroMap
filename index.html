<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>City Metro Map</title>

  <link rel="stylesheet" href="leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       NAVIGATION BAR
       ===================================== */

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 64px;

      background: white;
      border-bottom: 1px solid #dddddd;

      display: flex;
      align-items: center;

      padding: 0 24px;

      z-index: 2000;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    /* =====================================
       CITY METRO BRAND
       ===================================== */

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #222222;
      text-decoration: none;

      font-size: 22px;
      font-weight: 700;

      white-space: nowrap;
    }

    #metroLogo {
      width: 38px;
      height: 38px;

      object-fit: contain;

      display: block;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* =====================================
       DESKTOP NAVIGATION
       ===================================== */

    #navLinks {
      display: flex;
      align-items: center;

      margin-left: auto;

      gap: 8px;
    }

    #navLinks a {
      text-decoration: none;

      color: #333333;

      padding: 10px 16px;

      border-radius: 8px;

      font-size: 15px;
      font-weight: 600;

      transition: background 0.15s ease;
    }

    #navLinks a:hover {
      background: #eeeeee;
    }

    /* =====================================
       HAMBURGER
       ===================================== */

    #menuButton {
      display: none;

      margin-left: auto;

      width: 44px;
      height: 44px;

      border: none;
      border-radius: 8px;

      background: #f2f2f2;

      cursor: pointer;

      font-size: 25px;

      line-height: 44px;
      text-align: center;
    }

    #menuButton:active {
      background: #dddddd;
    }

    /* =====================================
       MOBILE MENU
       ===================================== */

    #mobileMenu {
      display: none;

      position: fixed;

      top: 64px;
      left: 0;
      right: 0;

      background: white;

      border-bottom: 1px solid #dddddd;

      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);

      z-index: 1999;
    }

    #mobileMenu a {
      display: block;

      padding: 17px 22px;

      color: #222222;

      text-decoration: none;

      font-size: 17px;
      font-weight: 600;

      border-bottom: 1px solid #eeeeee;
    }

    #mobileMenu a:active {
      background: #eeeeee;
    }

    /* =====================================
       MAP
       ===================================== */

    #map {
      position: fixed;

      top: 64px;
      left: 0;

      width: 100vw;

      height: calc(100vh - 64px);

      background: white;

      z-index: 1;
    }

    .leaflet-container {
      background: white !important;

      font-family: Arial, Helvetica, sans-serif;

      touch-action: none;
    }

    /* =====================================
       ZOOM CONTROLS
       ===================================== */

    .leaflet-control-zoom {
      margin: 12px !important;
    }

    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;

      line-height: 40px !important;

      font-size: 22px !important;
    }

    /* =====================================
       MOBILE
       ===================================== */

    @media (max-width: 700px) {

      #navbar {
        height: 58px;
        padding: 0 14px;
      }

      #brand {
        font-size: 19px;
        gap: 8px;
      }

      #metroLogo {
        width: 34px;
        height: 34px;
      }

      /* Hide desktop navigation */
      #navLinks {
        display: none;
      }

      /* Show hamburger */
      #menuButton {
        display: block;
      }

      #mobileMenu {
        top: 58px;
      }

      #map {
        top: 58px;
        height: calc(100vh - 58px);
      }

      .leaflet-control-zoom {
        margin: 10px !important;
      }

      .leaflet-control-zoom a {
        width: 44px !important;
        height: 44px !important;

        line-height: 44px !important;

        font-size: 24px !important;
      }
    }

    /* =====================================
       SMALL PHONES
       ===================================== */

    @media (max-width: 380px) {

      #brand {
        font-size: 17px;
      }

      #metroLogo {
        width: 32px;
        height: 32px;
      }

      #menuButton {
        width: 42px;
        height: 42px;

        line-height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       NAVIGATION
       ===================================== -->

  <nav id="navbar">

    <a
      id="brand"
      href="https://citymetro.xyz"
    >

      <img
        id="metroLogo"
        src="logo.png"
        alt="City Metro Logo"
      >

      <span>City Metro</span>

    </a>


    <!-- Desktop navigation -->

    <div id="navLinks">

      <a href="https://citymetro.xyz">
        Home
      </a>

      <a href="https://alerts.citymetro.xyz">
        Alerts
      </a>

      <a href="https://trip-planner.citymetro.xyz">
        Trip Planner
      </a>

    </div>


    <!-- Mobile hamburger -->

    <button
      id="menuButton"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>

  </nav>


  <!-- =====================================
       MOBILE MENU
       ===================================== -->

  <div id="mobileMenu">

    <a href="https://citymetro.xyz">
      🏠 Home
    </a>

    <a href="https://alerts.citymetro.xyz">
      ⚠️ Alerts
    </a>

    <a href="https://trip-planner.citymetro.xyz">
      🧭 Trip Planner
    </a>

  </div>


  <!-- =====================================
       MAP
       ===================================== -->

  <div id="map"></div>


  <script src="leaflet.js"></script>

  <script>

    /*
     * ==========================================
     * CITY METRO MAP
     * ==========================================
     */

    const image = new Image();

    image.src = "Lego City County Metro August 2026.png";


    image.onload = function () {

      const imageWidth = image.naturalWidth;
      const imageHeight = image.naturalHeight;

      console.log(
        "Metro Map:",
        imageWidth,
        "×",
        imageHeight
      );


      const bounds = [
        [0, 0],
        [imageHeight, imageWidth]
      ];


      /*
       * ========================================
       * CREATE MAP
       * ========================================
       */

      const map = L.map("map", {

        crs: L.CRS.Simple,

        minZoom: -5,

        maxZoom: 5,

        zoomSnap: 0.1,

        zoomDelta: 0.5,

        zoomControl: true,

        scrollWheelZoom: true,

        doubleClickZoom: true,

        dragging: true,

        touchZoom: true,

        inertia: true,

        maxBounds: bounds,

        maxBoundsViscosity: 1.0

      });


      /*
       * ========================================
       * IMAGE
       * ========================================
       */

      L.imageOverlay(
        "Lego City County Metro August 2026.png",
        bounds
      ).addTo(map);


      /*
       * ========================================
       * DEVICE-SPECIFIC INITIAL VIEW
       * ========================================
       *
       * DESKTOP:
       * Show the entire image.
       *
       * MOBILE:
       * Zoom in slightly so the map is
       * easier to read.
       */

      function setDeviceView() {

        const width =
          window.innerWidth;

        const height =
          window.innerHeight;


        /*
         * DESKTOP
         * 701px and above
         */

        if (width > 700) {

          map.fitBounds(
            bounds,
            {
              padding: [5, 5],
              animate: false
            }
          );

        }


        /*
         * MOBILE
         */

        else {

          /*
           * First calculate the normal
           * "fit everything" zoom.
           */

          map.fitBounds(
            bounds,
            {
              padding: [5, 5],
              animate: false
            }
          );


          /*
           * Then zoom in slightly.
           *
           * This means mobile won't be
           * extremely zoomed out.
           */

          const currentZoom =
            map.getZoom();

          map.setZoom(
            currentZoom + 0.45,
            {
              animate: false
            }
          );

        }

      }


      /*
       * Initial view
       */

      setTimeout(
        setDeviceView,
        50
      );


      /*
       * ========================================
       * RESIZE
       * ========================================
       */

      let resizeTimer;


      window.addEventListener(
        "resize",
        function () {

          clearTimeout(resizeTimer);


          resizeTimer = setTimeout(
            function () {

              map.invalidateSize({
                animate: false
              });


              setDeviceView();

            },
            150
          );

        }
      );


      /*
       * ========================================
       * PHONE ROTATION
       * ========================================
       */

      window.addEventListener(
        "orientationchange",
        function () {

          setTimeout(
            function () {

              map.invalidateSize({
                animate: false
              });

              setDeviceView();

            },
            400
          );

        }
      );

    };


    /*
     * ==========================================
     * IMAGE ERROR
     * ==========================================
     */

    image.onerror = function () {

      console.error(
        "Metro map image could not be loaded."
      );

      alert(
        "Could not load the Metro map image.\n\n" +
        "Make sure the file is named exactly:\n\n" +
        "Lego City County Metro August 2026.png"
      );

    };


    /*
     * ==========================================
     * MOBILE MENU
     * ==========================================
     */

    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const mobileMenu =
      document.getElementById(
        "mobileMenu"
      );


    let menuOpen = false;


    menuButton.addEventListener(
      "click",
      function () {

        menuOpen = !menuOpen;


        if (menuOpen) {

          mobileMenu.style.display =
            "block";

          menuButton.textContent =
            "✕";

          menuButton.setAttribute(
            "aria-expanded",
            "true"
          );

        }

        else {

          mobileMenu.style.display =
            "none";

          menuButton.textContent =
            "☰";

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );


    /*
     * Close menu after selecting
     * a navigation link.
     */

    const mobileLinks =
      mobileMenu.querySelectorAll(
        "a"
      );


    mobileLinks.forEach(
      function (link) {

        link.addEventListener(
          "click",
          function () {

            mobileMenu.style.display =
              "none";

            menuButton.textContent =
              "☰";

            menuOpen = false;

            menuButton.setAttribute(
              "aria-expanded",
              "false"
            );

          }
        );

      }
    );

  </script>

</body>
</html>
